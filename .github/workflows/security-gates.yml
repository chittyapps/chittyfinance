name: Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-secret-policy:
    name: Workflow Secret Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce workflow secret policy
        run: ./scripts/security/check-workflow-secrets.sh

  working-tree-secret-scan:
    name: Working Tree Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.wrangler \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.gif' \
            'ghp_[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PGP)? ?PRIVATE KEY' .; then
            echo "Secret-like pattern detected in working tree."
            exit 1
          fi

          echo "Working tree secret scan passed."

  dependency-audit:
    name: Dependency Audit (High+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Resolve package root
        id: pkg
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f development/chittyschema/package.json ]; then
            echo "dir=development/chittyschema" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dir=" >> "$GITHUB_OUTPUT"
          echo "No Node package root detected; skipping dependency audit."

      - name: Install dependencies
        if: steps.pkg.outputs.dir != ''
        run: |
          set -euo pipefail
          cd "${{ steps.pkg.outputs.dir }}"
          pnpm install --frozen-lockfile

      - name: Enforce audit high threshold
        if: steps.pkg.outputs.dir != ''
        run: |
          set -euo pipefail
          cd "${{ steps.pkg.outputs.dir }}"

          # pnpm v10 does not support npm's per-advisory `--ignore <CVE>` flag,
          # so we shell out to `pnpm audit --json` and post-filter with jq.
          #
          # Accepted (ignored) advisories — these are picomatch ReDoS findings in
          # transitive deps (neonctl, tailwindcss) whose parents pin the vulnerable
          # version. Cannot be resolved via pnpm overrides. Both the original
          # 2024 advisory ID and the renumbered 2026 advisory are listed so the
          # ignore survives advisory-DB renumbering.
          IGNORED_CVES='["CVE-2024-45296","CVE-2026-33671","CVE-2026-33672"]'

          # pnpm audit exits non-zero whenever advisories are found, so capture
          # JSON without aborting the step on that exit code.
          set +e
          AUDIT_JSON="$(pnpm audit --prod --json --ignore-registry-errors)"
          set -e

          # Filter remaining high/critical advisories after dropping the
          # accepted CVEs. `module_name == "picomatch"` is intentionally NOT
          # used — we want any *new* picomatch advisory (new CVE id) to fail.
          REMAINING="$(jq --argjson ignored "$IGNORED_CVES" '
            [ .advisories
              | to_entries[]
              | select(.value.severity == "high" or .value.severity == "critical")
              | select( ([.value.cves[]?] | map(. as $c | $ignored | index($c)) | all(. == null)) )
              | {id: .key, module: .value.module_name, severity: .value.severity, cves: .value.cves, url: .value.url}
            ]' <<<"$AUDIT_JSON")"

          COUNT="$(jq 'length' <<<"$REMAINING")"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT high/critical advisor(ies) beyond the accepted ignore list:"
            jq -r '.[] | "  - [\(.severity)] \(.module) \(.cves | join(",")) \(.url)"' <<<"$REMAINING"
            exit 1
          fi
          echo "No high/critical advisories beyond the accepted ignore list."
