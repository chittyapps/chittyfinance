name: Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-secret-policy:
    name: Workflow Secret Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce workflow secret policy
        run: ./scripts/security/check-workflow-secrets.sh

  working-tree-secret-scan:
    name: Working Tree Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.wrangler \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.gif' \
            'ghp_[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PGP)? ?PRIVATE KEY' .; then
            echo "Secret-like pattern detected in working tree."
            exit 1
          fi

          echo "Working tree secret scan passed."

  dependency-audit:
    name: Dependency Audit (High+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Resolve package root
        id: pkg
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f development/chittyschema/package.json ]; then
            echo "dir=development/chittyschema" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dir=" >> "$GITHUB_OUTPUT"
          echo "No Node package root detected; skipping dependency audit."

      - name: Install dependencies
        if: steps.pkg.outputs.dir != ''
        run: |
          set -euo pipefail
          cd "${{ steps.pkg.outputs.dir }}"
          pnpm install --frozen-lockfile

      # Accepted (ignored) advisories — the accept-list is EMPTY.
      #
      # Tracking issue https://github.com/chittyapps/chittyfinance/issues/126
      # asked for this list to be driven to zero. It reached zero on
      # 2026-09-08: every previously-accepted advisory (path-to-regexp, marked,
      # handlebars, minimist, form-data, moment, semver, tough-cookie,
      # micromatch, esbuild/postcss, tar, ws) now resolves above its patched
      # version through the pnpm.overrides floors in package.json.
      #
      # The filter mechanism below is deliberately kept so a genuinely
      # unfixable advisory can be accepted again — but an entry added here is a
      # hole in the gate, so it must carry a CVE/GHSA id, a reason, and a
      # next-step, and it must be removed the moment a fix ships. An
      # unmaintained accept-list is how this gate stops being a gate.
      #
      # Advisory DB lookup: https://github.com/advisories/<GHSA-id>
      - name: Enforce audit high threshold
        if: steps.pkg.outputs.dir != ''
        run: |
          set -euo pipefail
          cd "${{ steps.pkg.outputs.dir }}"

          # pnpm v10 does not support npm's per-advisory `--ignore <CVE>` flag,
          # so we shell out to `pnpm audit --json` and post-filter with jq.
          # Both CVE and GHSA ids are listed; the jq filter matches either.
          IGNORED_IDS='[]'

          # pnpm audit exits non-zero whenever advisories are found, so capture
          # JSON without aborting the step on that exit code.
          set +e
          AUDIT_JSON="$(pnpm audit --prod --json --ignore-registry-errors)"
          RC=$?
          set -e

          # Fail closed if pnpm produced no parseable audit JSON (network blip,
          # registry error, warnings on stdout, partial output, etc.). Accepts
          # either npm v6 / pnpm legacy (`.advisories`) or npm v7+ shape
          # (`.vulnerabilities`).
          if ! echo "$AUDIT_JSON" | jq -e 'has("advisories") or has("vulnerabilities")' >/dev/null 2>&1; then
            echo "::error::pnpm audit produced no parseable JSON (rc=$RC). Output was:"
            echo "$AUDIT_JSON" | head -c 500
            exit 1
          fi

          # Filter remaining high/critical advisories after dropping accepted
          # CVE/GHSA ids. Matches by CVE id OR github_advisory_id so that
          # advisory-DB renumbering does not silently re-open an accepted item.
          # Null-id guard: an advisory with no CVE AND no GHSA cannot be matched
          # against the accept-list, so we fail closed on it.
          REMAINING="$(jq --argjson ignored "$IGNORED_IDS" '
            [ ( (.advisories // .vulnerabilities) // {} )
              | to_entries[]
              | select(.value.severity == "high" or .value.severity == "critical")
              | . as $a
              | (([$a.value.cves[]?] + [$a.value.github_advisory_id])
                  | map(select(. != null))) as $ids
              | select(
                  ($ids | length) == 0
                  or ($ids | all(. as $id | ($ignored | index($id)) == null))
                )
              | {id: $a.key, module: $a.value.module_name, severity: $a.value.severity, cves: $a.value.cves, ghsa: $a.value.github_advisory_id, url: $a.value.url}
            ]' <<<"$AUDIT_JSON")"

          COUNT="$(jq 'length' <<<"$REMAINING")"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT high/critical advisor(ies) beyond the accepted ignore list:"
            jq -r '.[] | "  - [\(.severity)] \(.module) \(.cves | join(",")) \(.ghsa) \(.url)"' <<<"$REMAINING"
            exit 1
          fi
          echo "No high/critical advisories beyond the accepted ignore list."
