name: Secret Rotation Audit

# Currently fails by design — see scripts/secret-rotation-audit.sh. It replaces
# the "1Password Rotation Audit" workflow, which reported success nightly while
# auditing nothing. Scheduled and manual only; this is not a pull-request gate,
# so a red run here signals an unimplemented audit rather than blocking merges.

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Rotation Audit
        shell: bash
        run: bash scripts/secret-rotation-audit.sh
